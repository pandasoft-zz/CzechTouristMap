services:

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/work
    profiles:
      - dev

  tegola:
    build: ./tegola
    container_name: czechtouristmap-tegola
    environment:
      CONFIG: /app/config.toml
    volumes:
      - type: image
        source: ghcr.io/pandasoft-zz/czechtouristmap-osm:latest
        target: /data/maps
        read_only: true
      - ./tegola/config.toml:/app/config.toml:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: ./web
    container_name: czechtouristmap-web
    ports:
      - "80:80"
    depends_on:
      tegola:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./styles:/web/styles:ro
      - ./config:/web/config:ro
