# Fast checks for pull requests: styles, Java build, Python format, shell scripts.
# Does not build tiles (see maps.yml).
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No LFS here: the terrain tiles are not needed and would use the LFS quota.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: tiles/pom.xml

      - name: Install
        run: npm ci

      - name: Styles
        run: node tools/czmap.mjs check

      - name: Styles in MapLibre Native
        run: node tools/czmap.mjs check-native

      - name: JavaScript syntax
        run: for f in tools/*.mjs style/*.mjs style/*/*.mjs; do node --check "$f"; done

      - name: Java build
        run: mvn -q -B -f tiles/pom.xml package

      - name: Python format
        run: pipx run black==26.10.1 --check -l 88 relief/

      - name: Shell scripts
        run: shellcheck tools/*.sh
