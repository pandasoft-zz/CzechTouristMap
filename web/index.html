<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CzechTouristMap — Mapbox GL / PMTiles Viewer</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top toolbar -->
  <div id="toolbar">
    <span id="title">CzechTouristMap</span>

    <div id="mode-indicator">
      <span id="mode-text">Loading...</span>
    </div>

    <div id="loc-section">
      <select id="loc-select" title="Jump to location">
        <option value="">– locations –</option>
      </select>
    </div>

    <div id="status-bar">
      <span id="status-dot" class="dot dot-loading"></span>
      <span id="status-text">Connecting...</span>
    </div>
  </div>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Tile info overlay -->
  <div id="info-box">
    <div id="zoom-info">zoom: –</div>
    <div id="coords-info">lat/lng: –</div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@latest/dist/pmtiles.js"></script>
  <script src="app.js"></script>
</body>
</html>
